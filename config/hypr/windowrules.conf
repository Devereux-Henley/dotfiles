# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# Steam (rules adapted from caelestia-dots/caelestia hypr/hyprland/rules.conf)
windowrule {
    name = steam-rounding
    match:class = ^steam$
    rounding = 10
}

windowrule {
    name = steam-friends-float
    match:class = ^steam$
    match:title = Friends List
    float = yes
}

# Games — Steam, Lutris/Wine, Gamescope
windowrule {
    name = games-opaque
    match:class = (steam_app_(default|[0-9]+))|gamescope
    opaque = yes
}

windowrule {
    # Allow tearing for games
    name = games-immediate
    match:class = (steam_app_(default|[0-9]+))|gamescope
    immediate = yes
}

windowrule {
    # Don't let the screen idle while a game is running
    name = games-idle-inhibit
    match:class = (steam_app_(default|[0-9]+))|gamescope
    idle_inhibit = always
}

# Dialogs (adapted from caelestia-dots/caelestia)
windowrule {
    name = float-file-pickers
    match:title = (Select|Open)( a)? (File|Folder)(s)?
    float = yes
}

windowrule {
    name = float-file-progress
    match:title = File (Operation|Upload)( Progress)?
    float = yes
}

windowrule {
    name = float-properties
    match:title = .* Properties
    float = yes
}

windowrule {
    name = float-export-png
    match:title = Export Image as PNG
    float = yes
}

windowrule {
    name = float-gimp-crash
    match:title = GIMP Crash Debug
    float = yes
}

windowrule {
    name = float-save-as
    match:title = Save As
    float = yes
}

windowrule {
    name = float-library
    match:title = Library
    float = yes
}

# Special workspaces (adapted from caelestia-dots/caelestia)
windowrule {
    name = special-music-class
    match:class = feishin|[Ss]potify|Supersonic|Cider|com.github.th_ch.youtube_music|Plexamp|com-maxrave-simpmusic-MainKt
    workspace = special:music
}

windowrule {
    # Spotify on Wayland reports no class for some reason
    name = special-music-spotify-wayland
    match:initial_title = Spotify( Free)?
    workspace = special:music
}

windowrule {
    name = special-communication
    match:class = ^(com\.discordapp\.Discord|discord|equibop|vesktop|whatsapp)$
    workspace = special:communication
}
